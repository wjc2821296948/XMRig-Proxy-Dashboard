on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Use the requested Nemotron model through the LiteLLM OpenAI-compatible endpoint
      config.model: "openai/nvidia/nemotron-3-super-120b-a12b"
      config.fallback_models: '["openai/nvidia/nemotron-3-super-120b-a12b"]'
      config.custom_model_max_tokens: "131072"
      # LiteLLM OpenAI-compatible endpoint
      OPENAI__API_BASE: "https://litellm.lrate.top/v1"
      # Tool configuration
      github_action_config.auto_review: "true"
      github_action_config.auto_describe: "true"
      github_action_config.auto_improve: "true"
