on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:

jobs:
  pr_agent_job:
    # Ignore bot events and only let supported PR-Agent slash commands invoke PR-Agent.
    if: >-
      ${{
        github.event.sender.type != 'Bot' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.pull_request &&
            (
              github.event.comment.body == '/review' ||
              startsWith(github.event.comment.body, '/review ') ||
              github.event.comment.body == '/review_pr' ||
              startsWith(github.event.comment.body, '/review_pr ') ||
              github.event.comment.body == '/auto_review' ||
              startsWith(github.event.comment.body, '/auto_review ') ||
              github.event.comment.body == '/answer' ||
              startsWith(github.event.comment.body, '/answer ') ||
              github.event.comment.body == '/describe' ||
              startsWith(github.event.comment.body, '/describe ') ||
              github.event.comment.body == '/describe_pr' ||
              startsWith(github.event.comment.body, '/describe_pr ') ||
              github.event.comment.body == '/improve' ||
              startsWith(github.event.comment.body, '/improve ') ||
              github.event.comment.body == '/improve_code' ||
              startsWith(github.event.comment.body, '/improve_code ') ||
              github.event.comment.body == '/ask' ||
              startsWith(github.event.comment.body, '/ask ') ||
              github.event.comment.body == '/ask_question' ||
              startsWith(github.event.comment.body, '/ask_question ') ||
              github.event.comment.body == '/ask_line' ||
              startsWith(github.event.comment.body, '/ask_line ') ||
              github.event.comment.body == '/update_changelog' ||
              startsWith(github.event.comment.body, '/update_changelog ') ||
              github.event.comment.body == '/add_docs' ||
              startsWith(github.event.comment.body, '/add_docs ') ||
              github.event.comment.body == '/generate_labels' ||
              startsWith(github.event.comment.body, '/generate_labels ') ||
              github.event.comment.body == '/config' ||
              startsWith(github.event.comment.body, '/config ') ||
              github.event.comment.body == '/settings' ||
              startsWith(github.event.comment.body, '/settings ') ||
              github.event.comment.body == '/help' ||
              startsWith(github.event.comment.body, '/help ') ||
              github.event.comment.body == '/similar_issue' ||
              startsWith(github.event.comment.body, '/similar_issue ')
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run PR Agent on pull requests and supported slash commands
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.46.0
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep critical PR-Agent settings in the workflow so they are available
      # even when .pr_agent.toml is introduced or changed by the current PR.
      config.model: "openai/nvidia/nemotron-3-ultra-550b-a55b"
      config.fallback_models: '["openai/nvidia/nemotron-3-super-120b-a12b"]'
      config.custom_model_max_tokens: "131072"
      OPENAI.API_BASE: "https://litellm.lrate.top/v1"
      github_action_config.auto_review: "true"
      github_action_config.auto_describe: "false"
      github_action_config.auto_improve: "false"
      github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
      github_action_config.handle_push_trigger: "false"
