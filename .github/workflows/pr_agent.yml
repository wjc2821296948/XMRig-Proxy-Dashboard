on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:

jobs:
  pr_agent_job:
    # Ignore bot events and only let slash-commands on PR comments invoke PR-Agent.
    if: >-
      ${{
        github.event.sender.type != 'Bot' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.pull_request &&
            startsWith(github.event.comment.body, '/')
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run PR Agent on pull requests and slash commands
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.46.0
    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
