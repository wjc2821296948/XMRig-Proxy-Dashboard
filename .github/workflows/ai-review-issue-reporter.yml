name: AI Review Issue Reporter

on:
  workflow_run:
    workflows: ["AI Maintenance Bootstrap"]
    types: [completed]

permissions: {}

concurrency:
  group: ai-review-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    # Only publish reports from a manually dispatched run on the trusted default branch.
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Publishing cannot dispatch workflows; the dispatch permission is isolated below.
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      auto_fix_enabled: ${{ steps.publish-report.outputs.auto_fix_enabled }}
      auto_fix_issue_number: ${{ steps.publish-report.outputs.auto_fix_issue_number }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download agent report artifact
        id: download-agent
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: report-agent

      - name: Download fallback report artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output-fallback
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: report-fallback

      - name: Download usage statistics artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: usage-artifact

      - name: Create or update the review report Issue
        id: publish-report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { buildReviewData, getReportIssueState, shouldDispatchAutoFix, upsertRerunSummary } = require('./.github/scripts/ai-review-issue-report.cjs');
            const run = context.payload.workflow_run;
            const report = buildReviewData({
              agentDir: 'report-agent',
              fallbackDir: 'report-fallback',
              usageDir: 'usage-artifact',
              run,
            });
            const { owner, repo } = context.repo;

            // Ensure the requested label exists before attaching it to the report.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'ai-review' });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'ai-review',
                  color: '1d76db',
                  description: 'Automated AI maintenance review reports',
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            // Search by the Run ID, not by date or title alone, to make publication idempotent.
            const query = `repo:${owner}/${repo} is:issue in:title "${report.runId}"`;
            const matches = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 20 });
            const existing = matches.data.items.find((item) =>
              !item.pull_request && (item.body || '').includes(report.marker));

            let issue;
            if (!existing) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: report.title,
                body: report.body,
                labels: ['ai-review'],
              });
              issue = created.data;
            } else {
              issue = existing;
              const alreadyRecordedAttempt = (existing.body || '').includes(report.attemptMarker);
              if (!alreadyRecordedAttempt) {
                await upsertRerunSummary({ github, owner, repo, issueNumber: existing.number, report });
              }
              const hasLabel = (existing.labels || []).some((label) => label.name === 'ai-review');
              if (!hasLabel) {
                const labeled = await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: existing.number,
                  labels: ['ai-review'],
                });
                issue = { ...existing, labels: labeled.data };
              }
            }

            // Only the first publication chooses open/closed from the report.
            // Reruns preserve the existing Issue state so automation cannot close
            // findings awaiting human handling or reopen an Issue closed by a person.
            const desiredState = getReportIssueState(report, existing);
            if (!existing && desiredState === 'closed') {
              const closed = await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              issue = closed.data;
            }

            core.info(`AI review report recorded in ${issue.html_url} (${desiredState}).`);
            core.info(`Findings: critical=${report.counts.critical}, high=${report.counts.high}, medium=${report.counts.medium}, low=${report.counts.low}, unclassified=${report.counts.unclassified}.`);

            // Pass only validated scalar outputs to a separate job with actions:write.
            // That job performs no checkout, artifact download, or repository-code execution.
            const autoFixEnabled = shouldDispatchAutoFix(report, issue);
            core.setOutput('auto_fix_enabled', autoFixEnabled ? 'true' : 'false');
            core.setOutput('auto_fix_issue_number', autoFixEnabled ? String(issue.number) : '');
            core.info(autoFixEnabled
              ? `Queued AI Review Auto Fix dispatch for trusted report Issue #${issue.number}.`
              : 'Automatic fixes were not dispatched: report is incomplete, unreliable, closed, untrusted, or has no findings.');
            await core.summary
              .addHeading('AI review report published')
              .addLink(`#${issue.number} — ${report.title}`, issue.html_url)
              .addTable([
                [{ data: 'Status', header: true }, { data: 'Findings', header: true }, { data: 'AIC', header: true }],
                [desiredState, String(report.counts.total), report.aic],
              ])
              .write();

  dispatch-auto-fix:
    name: Dispatch trusted AI review fix
    needs: publish
    if: needs.publish.outputs.auto_fix_enabled == 'true'
    runs-on: ubuntu-latest
    # This job receives only a validated issue number and has no access to repository contents or issues.
    permissions:
      actions: write
    steps:
      - name: Dispatch the auto-fix workflow on the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.publish.outputs.auto_fix_issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER || '';
            const defaultBranch = process.env.DEFAULT_BRANCH || '';
            if (!/^[1-9]\d*$/.test(issueNumber)) {
              throw new Error('Refusing to dispatch: invalid report issue number.');
            }
            if (!defaultBranch || defaultBranch.startsWith('-')) {
              throw new Error('Refusing to dispatch: repository default branch is unavailable or invalid.');
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ai-review-auto-fix.lock.yml',
              ref: defaultBranch,
              inputs: { issue_number: issueNumber },
            });
            core.info(`Dispatched AI Review Auto Fix for trusted report Issue #${issueNumber}.`);
