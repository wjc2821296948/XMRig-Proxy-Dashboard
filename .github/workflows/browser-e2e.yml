name: Browser E2E

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "bin/**"
      - ".github/qa/**"
      - ".github/workflows/browser-e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "bin/**"
      - ".github/qa/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated QA dependencies
        run: npm ci --prefix .github/qa

      - name: Install Chromium
        run: npx --prefix .github/qa playwright install --with-deps chromium

      - name: Run browser regression suite
        run: npm --prefix .github/qa test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            .github/qa/test-results/
            .github/qa/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  sandbox-security-smoke:
    name: Browser Use container isolation smoke
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/ai-browser-qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout without a persisted GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare non-sensitive smoke context
        run: |
          cat > qa-context.json <<'QA_CONTEXT'
          {"task":"container isolation smoke only","issue_number":null}
          QA_CONTEXT

      - name: Build images and verify network isolation (no model call)
        env:
          QA_EXPLORER_LITELLM_API_KEY: sandbox-smoke-placeholder
          QA_EXPLORER_MODEL: sandbox-smoke-model
          QA_SANDBOX_SMOKE_ONLY: "true"
        run: bash .github/qa/agent/run-sandbox.sh qa-context.json /tmp/unused-ai-browser-report.json
