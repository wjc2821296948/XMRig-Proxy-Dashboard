name: Dashboard CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: npm test

  static-security:
    name: Static security and structure checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run static checks
        run: node --experimental-default-type=module --test tests/static.test.js

      - name: Run QA security helper tests
        run: python3 -m unittest discover -s tests -p 'qa_*_test.py'

  syntax-check:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js tests/*.js .github/qa/*.js .github/qa/tests/*.js .github/qa/fixtures/*.js; do
            node --experimental-default-type=module --check "$file"
          done
          python -m py_compile .github/qa/agent/*.py .github/scripts/qa-fix-agent.py
          bash -n .github/qa/agent/run-sandbox.sh
