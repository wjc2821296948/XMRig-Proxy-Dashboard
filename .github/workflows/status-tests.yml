name: Status state tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  status-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build browser bundle
        run: npm run build
